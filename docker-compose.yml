version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: zeroq-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: virtual_queue
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zeroq-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/virtual_queue
      FRONTEND_URL: http://localhost:3000
      SERVER_URL: http://backend:5000
      JWT_SECRET: super_secure_production_secret_key_998811
    ports:
      - "5000:5000"

volumes:
  mongo-data:
